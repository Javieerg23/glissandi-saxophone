  /api/v1/catalog/blocked/:
    get:
      operationId: v1_catalog_blocked_list
      description: |-
        Lista de bloqueados: bloquear es crear y desbloquear es borrar.

        Blocked list: blocking is creating and unblocking is deleting.
      parameters:
      - in: query
        name: deezer_id
        schema:
          type: integer
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - album
          - artist
          - track
        description: |-
          * `artist` - Artista
          * `album` - Álbum
          * `track` - Canción
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockedItemList'
          description: ''
    post:
      operationId: v1_catalog_blocked_create
      description: |-
        Lista de bloqueados: bloquear es crear y desbloquear es borrar.

        Blocked list: blocking is creating and unblocking is deleting.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlockedItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlockedItemRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedItem'
          description: ''
  /api/v1/catalog/blocked/{id}/:
    delete:
      operationId: v1_catalog_blocked_destroy
      description: |-
        Lista de bloqueados: bloquear es crear y desbloquear es borrar.

        Blocked list: blocking is creating and unblocking is deleting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este blocked item.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalog/deezer/artists/:
    get:
      operationId: v1_catalog_deezer_artists_retrieve
      description: Resultados con marca de los que ya están o están bloqueados. /
        Annotated results.
      parameters:
      - in: query
        name: index
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeezerSearch'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/catalog/summary/:
