components:
  schemas:
    ActivityLog:
      type: object
      description: Una entrada del historial de actividad. / One activity history
        entry.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        username:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          description: Devuelve ``app.modelo`` del objeto afectado. / Returns ``app.model``
            of the target.
          readOnly: true
        object_id:
          type: string
          readOnly: true
        detail:
          readOnly: true
      required:
      - action
      - created_at
      - detail
      - id
      - object_id
      - object_type
      - user
      - username
    Album:
      type: object
      description: Álbum con sus artistas; título, fecha y portada son editables.
        / Album with artists.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        release_date:
          type: string
          format: date
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
          readOnly: true
        deezer_id:
          type: integer
          readOnly: true
          nullable: true
        musicbrainz_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - artists
      - deezer_id
      - id
      - musicbrainz_id
      - title
    AlbumRequest:
      type: object
      description: Álbum con sus artistas; título, fecha y portada son editables.
        / Album with artists.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        release_date:
          type: string
          format: date
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - title
    Artist:
      type: object
      description: Artista; nombre e imagen son editables. / Artist; name and image
        are editable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        deezer_id:
          type: integer
          readOnly: true
          nullable: true
        musicbrainz_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - deezer_id
      - id
      - musicbrainz_id
      - name
    ArtistIdsRequest:
      type: object
      description: Lista ordenada de artistas; el primero es el principal. / Ordered
