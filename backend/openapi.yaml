      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevertRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RevertRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
  /api/v1/catalog/artists/:
    get:
      operationId: v1_catalog_artists_list
      description: Artistas del catálogo. / Catalogue artists.
      parameters:
      - in: query
        name: deezer_id
        schema:
          type: integer
      - in: query
        name: musicbrainz_id
        schema:
          type: string
          format: uuid
      - in: query
        name: name__icontains
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistList'
          description: ''
  /api/v1/catalog/artists/{id}/:
    get:
      operationId: v1_catalog_artists_retrieve
      description: Artistas del catálogo. / Catalogue artists.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este artist.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
          description: ''
    put:
      operationId: v1_catalog_artists_update
      description: Artistas del catálogo. / Catalogue artists.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este artist.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
