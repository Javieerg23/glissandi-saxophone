          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevertRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RevertRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
          description: ''
components:
  schemas:
    Album:
      type: object
      description: Álbum con sus artistas; título, fecha y portada son editables.
        / Album with artists.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        release_date:
          type: string
          format: date
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
          readOnly: true
        deezer_id:
          type: integer
          readOnly: true
          nullable: true
        musicbrainz_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - artists
      - deezer_id
      - id
      - musicbrainz_id
      - title
    AlbumRequest:
      type: object
      description: Álbum con sus artistas; título, fecha y portada son editables.
        / Album with artists.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        release_date:
          type: string
          format: date
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - title
    Artist:
      type: object
      description: Artista; nombre e imagen son editables. / Artist; name and image
        are editable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        deezer_id:
          type: integer
          readOnly: true
          nullable: true
        musicbrainz_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - deezer_id
      - id
      - musicbrainz_id
      - name
    ArtistIdsRequest:
      type: object
      description: Lista ordenada de artistas; el primero es el principal. / Ordered
        artist list.
      properties:
        artists:
          type: array
          items:
            type: integer
      required:
      - artists
    ArtistRequest:
      type: object
      description: Artista; nombre e imagen son editables. / Artist; name and image
        are editable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - name
    BlockedItem:
      type: object
      description: Elemento bloqueado; un bloqueo por tipo e identificador. / Blocked
        item.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        deezer_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - deezer_id
      - id
      - kind
    BlockedItemRequest:
      type: object
      description: Elemento bloqueado; un bloqueo por tipo e identificador. / Blocked
        item.
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        deezer_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          maxLength: 255
      required:
      - deezer_id
      - kind
    CredentialsRequest:
      type: object
      description: Usuario y contraseña de entrada. / Username and password input.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Credit:
      type: object
      description: Artista de un crédito, en orden. / Artist of a credit, in order.
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: integer
      required:
      - id
      - name
      - position
    CreditRequest:
      type: object
      description: Artista de un crédito, en orden. / Artist of a credit, in order.
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
        position:
          type: integer
      required:
      - id
      - name
      - position
    DeezerArtist:
      type: object
      description: Artista encontrado en Deezer. / Artist found on Deezer.
      properties:
        deezer_id:
          type: integer
        name:
          type: string
        image_url:
          type: string
          nullable: true
        album_count:
          type: integer
          nullable: true
        fan_count:
          type: integer
          nullable: true
        in_catalog:
          type: boolean
        blocked:
          type: boolean
      required:
      - album_count
      - blocked
      - deezer_id
      - fan_count
      - image_url
      - in_catalog
      - name
    DeezerSearch:
      type: object
      description: Página de resultados de Deezer. / Page of Deezer results.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeezerArtist'
        total:
          type: integer
        next_index:
          type: integer
          nullable: true
      required:
      - next_index
      - results
      - total
    Detail:
      type: object
      description: Cuerpo de error con un mensaje legible. / Error body with a readable
        message.
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      description: Respuesta del endpoint de estado. / Health endpoint response.
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    HistoryEntry:
      type: object
      description: Versión anterior de un elemento. / Past version of an item.
      properties:
        history_id:
          type: integer
        history_date:
          type: string
          format: date-time
        history_type:
          type: string
          description: + creado, ~ modificado, - borrado.
        history_user:
          type: string
          nullable: true
        changes:
          type: object
          additionalProperties: {}
          description: Valores de los campos editables.
      required:
      - changes
      - history_date
      - history_id
      - history_type
      - history_user
    KindEnum:
      enum:
      - artist
      - album
      - track
      type: string
      description: |-
        * `artist` - Artista
        * `album` - Álbum
        * `track` - Canción
    LibrarySummary:
      type: object
      description: Recuentos de la biblioteca. / Library counts.
      properties:
        artists:
          type: integer
        albums:
          type: integer
        tracks:
          type: integer
        downloaded:
          type: integer
          description: Canciones con alguna descarga.
      required:
      - albums
      - artists
      - downloaded
      - tracks
    NewAccountRequest:
      type: object
      description: |-
        Alta de la primera cuenta; valida usuario y contraseña con las reglas de Django.

        First account creation, validated with Django's own rules.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PaginatedAlbumList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
