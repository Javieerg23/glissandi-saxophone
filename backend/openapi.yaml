      type: object
      description: Línea del registro de una ejecución. / One log line of a run.
      properties:
        position:
          type: integer
          readOnly: true
          title: Posición
        level:
          allOf:
          - $ref: '#/components/schemas/JobRunLineLevelEnum'
          readOnly: true
          title: Nivel
        message:
          type: string
          readOnly: true
          title: Mensaje
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha
      required:
      - created_at
      - level
      - message
      - position
    JobRunLineLevelEnum:
      enum:
      - info
      - warning
      - error
      type: string
      description: |-
        * `info` - información
        * `warning` - aviso
        * `error` - error
    JobRunStatusEnum:
      enum:
      - pending
      - running
      - stopping
      - stopped
      - succeeded
      - failed
      - interrupted
      type: string
      description: |-
        * `pending` - pendiente
        * `running` - en curso
        * `stopping` - deteniéndose
        * `stopped` - detenida
        * `succeeded` - correcta
        * `failed` - fallida
        * `interrupted` - interrumpida
