  /api/v1/activity/logs/:
    get:
      operationId: v1_activity_logs_list
      description: |-
        Logs técnicos de la base de datos, solo para administradores.

        Technical logs stored in the database, administrators only.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: min_level
        schema:
          type: integer
      - in: query
        name: module
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: task
        schema: {}
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTechnicalLogList'
          description: ''
  /api/v1/activity/logs/{id}/:
    get:
