          description: ''
    patch:
      operationId: v1_catalog_tracks_partial_update
      description: Canciones del catálogo. / Catalogue tracks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este track.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTrackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTrackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTrackRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
          description: ''
  /api/v1/catalog/tracks/{id}/artists/:
    put:
      operationId: v1_catalog_tracks_artists_update
      description: Reemplaza los artistas, en el orden recibido. / Replaces the artists
        in order.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este track.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
          description: ''
  /api/v1/catalog/tracks/{id}/history/:
    get:
      operationId: v1_catalog_tracks_history_list
      description: Versiones del elemento, la más reciente primero. / Item versions,
        newest first.
      parameters:
      - in: query
        name: album
        schema:
          type: number
      - in: query
        name: artist
        schema:
          type: number
      - in: query
        name: deezer_id
        schema:
          type: integer
      - in: query
        name: downloaded
        schema:
          type: boolean
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este track.
        required: true
      - in: query
        name: isrc
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryEntryList'
          description: ''
  /api/v1/catalog/tracks/{id}/revert/:
    post:
      operationId: v1_catalog_tracks_revert_create
      description: Devuelve los campos editables a los de una versión. / Restores
        a version.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este track.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
