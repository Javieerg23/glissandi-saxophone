      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        role:
          type: string
          description: Devuelve el rol del usuario. / Returns the user's role.
          readOnly: true
        is_active:
          type: boolean
          title: Activo
          description: Indica si el usuario debe ser tratado como activo. Desmarque
