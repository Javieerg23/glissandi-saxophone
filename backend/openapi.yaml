                $ref: '#/components/schemas/PaginatedTrackList'
          description: ''
  /api/v1/catalog/tracks/{id}/:
    get:
      operationId: v1_catalog_tracks_retrieve
      description: Canciones del catálogo. / Catalogue tracks.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este track.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
