          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtistRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
          description: ''
  /api/v1/catalog/artists/{id}/history/:
    get:
