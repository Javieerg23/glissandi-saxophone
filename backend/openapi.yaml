openapi: 3.0.3
info:
  title: Glissandi API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Indica que el servicio responde; lo usan el front y los despliegues.

        Reports that the service is up; used by the frontend and deployments.
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: Abre la sesión con usuario y contraseña. / Opens a session.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Cierra la sesión. / Closes the session.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: |-
        Devuelve usuario, rol e intentos fallidos desde el último inicio de sesión.

        Returns username, role and failed attempts since the last successful sign-in.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/accounts/password/:
    post:
      operationId: v1_accounts_password_create
      description: Cambia la contraseña y conserva la sesión actual. / Changes the
        password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/setup/:
    get:
      operationId: v1_accounts_setup_retrieve
      description: Indica si falta configurar y entrega la cookie CSRF. / Reports
        setup status.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
          description: ''
    post:
      operationId: v1_accounts_setup_create
      description: Crea el primer administrador y abre su sesión. / Creates the first
        admin.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/username/:
    post:
      operationId: v1_accounts_username_create
      description: Renombra al usuario. / Renames the user.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/users/:
    get:
      operationId: v1_accounts_users_list
      description: Lista todos los usuarios. / Lists every user.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedUser'
          description: ''
    post:
      operationId: v1_accounts_users_create
      description: Crea un usuario con su rol. / Creates a user with a role.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManagedUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManagedUserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/users/{id}/:
    patch:
      operationId: v1_accounts_users_partial_update
      description: |-
        Cambia el rol o desactiva a un usuario. / Changes a user's role or deactivates them.

        Nadie se quita a sí mismo el rol de administrador ni se desactiva, así
        siempre queda un administrador con sesión.
        Nobody can demote or deactivate themselves, so an administrator always remains.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedManagedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedManagedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedManagedUserUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/activity/entries/:
    get:
      operationId: v1_activity_entries_list
      description: |-
        Historial de actividad. Solo lectura: nadie borra ni modifica registros.

        Activity history. Read only: nobody deletes or edits records.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: number
      - in: query
        name: username
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
  /api/v1/activity/entries/{id}/:
    get:
      operationId: v1_activity_entries_retrieve
      description: |-
        Historial de actividad. Solo lectura: nadie borra ni modifica registros.

