openapi: 3.0.3
info:
  title: Glissandi API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Indica que el servicio responde; lo usan el front y los despliegues.

        Reports that the service is up; used by the frontend and deployments.
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: Abre la sesión con usuario y contraseña. / Opens a session.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Cierra la sesión. / Closes the session.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: Devuelve usuario y rol. / Returns username and role.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/password/:
    post:
      operationId: v1_accounts_password_create
      description: Cambia la contraseña y conserva la sesión actual. / Changes the
        password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/setup/:
    get:
      operationId: v1_accounts_setup_retrieve
      description: Indica si falta configurar y entrega la cookie CSRF. / Reports
        setup status.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
          description: ''
    post:
      operationId: v1_accounts_setup_create
      description: Crea el primer administrador y abre su sesión. / Creates the first
        admin.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/username/:
    post:
      operationId: v1_accounts_username_create
      description: Renombra al usuario. / Renames the user.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/preferences/:
    get:
      operationId: v1_preferences_list
      description: |-
        Lista todos los ajustes con su valor y su valor por defecto.

        Lists every setting with its value and its default.
      tags:
      - preferences
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
          description: ''
  /api/v1/preferences/{key}/:
    get:
      operationId: v1_preferences_retrieve
      description: Devuelve un ajuste. / Returns one setting.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - preferences
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
    put:
      operationId: v1_preferences_update
      description: Cambia el valor de un ajuste y lo registra. / Changes a setting
        and logs it.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreferenceWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreferenceWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
  /api/v1/proxies/:
    get:
      operationId: v1_proxies_list
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proxy'
          description: ''
    post:
      operationId: v1_proxies_create
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
          description: ''
  /api/v1/proxies/{id}/:
    get:
      operationId: v1_proxies_retrieve
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proxy.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
          description: ''
    put:
      operationId: v1_proxies_update
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proxy.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
          description: ''
    patch:
      operationId: v1_proxies_partial_update
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proxy.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProxyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProxyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProxyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proxy'
          description: ''
    delete:
      operationId: v1_proxies_destroy
      description: CRUD de proxies y prueba de conexión. / Proxy CRUD and connection
        test.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proxy.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/proxies/{id}/check/:
    post:
      operationId: v1_proxies_check_create
      description: |-
        Comprueba que el proxy da salida al tráfico. / Checks that the proxy relays traffic.

        Un código 2xx o 3xx cuenta como correcto.
        A 2xx or 3xx status counts as success.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proxy.
        required: true
      tags:
      - proxies
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyCheck'
          description: ''
  /api/v1/watches/:
    get:
      operationId: v1_watches_list
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWatchList'
          description: ''
    post:
      operationId: v1_watches_create
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WatchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
          description: ''
  /api/v1/watches/{id}/:
    get:
      operationId: v1_watches_retrieve
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este watch.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
          description: ''
    put:
      operationId: v1_watches_update
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este watch.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WatchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
          description: ''
    patch:
      operationId: v1_watches_partial_update
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este watch.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWatchRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
          description: ''
    delete:
      operationId: v1_watches_destroy
      description: CRUD de vigilancias e historial de comprobaciones. / Watch CRUD
        and check history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este watch.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/watches/{id}/runs/:
    get:
      operationId: v1_watches_runs_list
      description: |-
        Historial de comprobaciones, de la más reciente a la más antigua.

        Check history, newest first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este watch.
        required: true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - watches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWatchRunList'
          description: ''
components:
  schemas:
    CredentialsRequest:
      type: object
      description: Usuario y contraseña de entrada. / Username and password input.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Detail:
      type: object
      description: Cuerpo de error con un mensaje legible. / Error body with a readable
        message.
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      description: Respuesta del endpoint de estado. / Health endpoint response.
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    NewAccountRequest:
      type: object
      description: |-
        Alta de la primera cuenta; valida usuario y contraseña con las reglas de Django.

        First account creation, validated with Django's own rules.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PaginatedWatchList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Watch'
    PaginatedWatchRunList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/WatchRun'
    PasswordChangeRequest:
      type: object
      description: Cambio de contraseña. / Password change.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    PatchedProxyRequest:
      type: object
      description: |-
        Proxy saliente. Los contadores los actualiza la descarga, no la API.

        Outbound proxy. The counters are maintained by downloads, not by the API.
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 500
        enabled:
          type: boolean
          title: Activo
    PatchedWatchRequest:
      type: object
      description: Vigilancia de novedades. / New-release watch.
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 120
        enabled:
          type: boolean
          title: Activa
    Preference:
      type: object
      description: Ajuste con valor efectivo y por defecto. / Setting with effective
        and default value.
      properties:
        key:
          type: string
          readOnly: true
        value:
          readOnly: true
        default:
          readOnly: true
      required:
      - default
      - key
      - value
    PreferenceWriteRequest:
      type: object
      description: |-
        Valor nuevo de un ajuste. / New value for a setting.

        Solo se admite el mismo tipo que el valor por defecto: así un ajuste no
        cambia de forma y el código que lo lee no tiene que defenderse de ello.
        Only the default's type is accepted, so a setting never changes shape and
        its readers need no defensive parsing.
      properties:
        value: {}
      required:
      - value
    Profile:
      type: object
      description: Usuario con sesión y su rol. / Signed-in user and role.
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - username
    Proxy:
      type: object
      description: |-
        Proxy saliente. Los contadores los actualiza la descarga, no la API.

        Outbound proxy. The counters are maintained by downloads, not by the API.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          maxLength: 500
        enabled:
          type: boolean
          title: Activo
        success_count:
          type: integer
          readOnly: true
          title: Éxitos
        failure_count:
          type: integer
          readOnly: true
          title: Fallos
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último uso
        last_failed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último fallo
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado
      required:
      - created_at
      - failure_count
      - id
      - last_failed_at
      - last_used_at
      - success_count
      - url
    ProxyCheck:
      type: object
      description: Resultado de probar un proxy. / Result of testing a proxy.
      properties:
        ok:
          type: boolean
        status_code:
          type: integer
          nullable: true
      required:
      - ok
      - status_code
    ProxyRequest:
      type: object
      description: |-
        Proxy saliente. Los contadores los actualiza la descarga, no la API.

        Outbound proxy. The counters are maintained by downloads, not by the API.
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 500
        enabled:
          type: boolean
          title: Activo
      required:
      - url
    RoleEnum:
      enum:
      - administrador
      - usuario
      type: string
      description: |-
        * `administrador` - administrador
        * `usuario` - usuario
    SetupStatus:
      type: object
      description: Si falta crear el primer administrador. / Whether the first admin
        is still missing.
      properties:
        needed:
          type: boolean
      required:
      - needed
    StatusEnum:
      enum:
      - succeeded
      - failed
      type: string
      description: |-
        * `succeeded` - correcta
        * `failed` - fallida
    UsernameChangeRequest:
      type: object
      description: Cambio de nombre de usuario. / Username change.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - current_password
      - username
    Watch:
      type: object
      description: Vigilancia de novedades. / New-release watch.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 120
        enabled:
          type: boolean
          title: Activa
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creada
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizada
      required:
      - created_at
      - id
      - name
      - updated_at
    WatchRequest:
      type: object
      description: Vigilancia de novedades. / New-release watch.
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 120
        enabled:
          type: boolean
          title: Activa
      required:
      - name
    WatchRun:
      type: object
      description: Resultado de una comprobación, solo lectura. / One check result,
        read-only.
      properties:
        id:
          type: integer
          readOnly: true
        watch:
          type: integer
          readOnly: true
          title: Vigilancia
        started_at:
          type: string
          format: date-time
          readOnly: true
          title: Inicio
        finished_at:
          type: string
          format: date-time
          readOnly: true
          title: Fin
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Estado
        found:
          type: integer
          readOnly: true
          title: Novedades encontradas
        detail:
          type: string
          readOnly: true
          title: Detalle
      required:
      - detail
      - finished_at
      - found
      - id
      - started_at
      - status
      - watch
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
