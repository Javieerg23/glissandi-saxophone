openapi: 3.0.3
info:
  title: Glissandi API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Indica que el servicio responde; lo usan el front y los despliegues.

        Reports that the service is up; used by the frontend and deployments.
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: Abre la sesión con usuario y contraseña. / Opens a session.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Cierra la sesión. / Closes the session.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: Devuelve usuario y rol. / Returns username and role.
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/password/:
    post:
      operationId: v1_accounts_password_create
      description: Cambia la contraseña y conserva la sesión actual. / Changes the
        password.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/setup/:
    get:
      operationId: v1_accounts_setup_retrieve
      description: Indica si falta configurar y entrega la cookie CSRF. / Reports
        setup status.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
          description: ''
    post:
      operationId: v1_accounts_setup_create
      description: Crea el primer administrador y abre su sesión. / Creates the first
        admin.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/username/:
    post:
      operationId: v1_accounts_username_create
      description: Renombra al usuario. / Renames the user.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/catalog/albums/:
    get:
      operationId: v1_catalog_albums_list
      description: Álbumes del catálogo. / Catalogue albums.
      parameters:
      - in: query
        name: artist
        schema:
          type: number
      - in: query
        name: deezer_id
        schema:
          type: integer
      - in: query
        name: musicbrainz_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: released_after
        schema:
          type: string
          format: date
      - in: query
        name: released_before
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumList'
          description: ''
  /api/v1/catalog/albums/{id}/:
    get:
      operationId: v1_catalog_albums_retrieve
      description: Álbumes del catálogo. / Catalogue albums.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
    put:
      operationId: v1_catalog_albums_update
      description: Álbumes del catálogo. / Catalogue albums.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
    patch:
      operationId: v1_catalog_albums_partial_update
      description: Álbumes del catálogo. / Catalogue albums.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
  /api/v1/catalog/albums/{id}/artists/:
    put:
      operationId: v1_catalog_albums_artists_update
      description: Reemplaza los artistas, en el orden recibido. / Replaces the artists
        in order.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistIdsRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
  /api/v1/catalog/albums/{id}/history/:
    get:
      operationId: v1_catalog_albums_history_list
      description: Versiones del elemento, la más reciente primero. / Item versions,
        newest first.
      parameters:
      - in: query
        name: artist
        schema:
          type: number
      - in: query
        name: deezer_id
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este album.
        required: true
      - in: query
        name: musicbrainz_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: released_after
        schema:
          type: string
          format: date
      - in: query
        name: released_before
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryEntryList'
          description: ''
  /api/v1/catalog/albums/{id}/revert/:
    post:
      operationId: v1_catalog_albums_revert_create
      description: Devuelve los campos editables a los de una versión. / Restores
