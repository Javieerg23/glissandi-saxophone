      type: object
      description: |-
        Estado y progreso de una ejecución, solo lectura.

        State and progress of a run, read only.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
          title: Tipo
        params:
          readOnly: true
          title: Parámetros
        user:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/JobRunStatusEnum'
          readOnly: true
          title: Estado
        started_at:
          type: string
          format: date-time
          readOnly: true
          title: Inicio
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fin
        done:
          type: integer
          readOnly: true
          title: Hechas
        total:
          type: integer
          readOnly: true
        current:
          type: string
          readOnly: true
          title: Elemento actual
        summary:
          readOnly: true
          title: Resumen
      required:
      - current
      - done
      - finished_at
      - id
      - kind
      - params
      - started_at
      - status
      - summary
      - total
      - user
