name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Semanal: aparecen CVE nuevos sin que cambie el código.
  # Weekly: new CVEs show up without any code change.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || 'sqlite:///db.sqlite3' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover necesita el historial para comparar con la rama base.
          # diff-cover needs history to compare against the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: interrogate .
      - run: pip-audit -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      # compilemessages necesita msgfmt y los tests de audio ffmpeg; el runner no trae ninguno.
      # compilemessages needs msgfmt and the audio tests need ffmpeg; the runner ships neither.
      - run: sudo apt-get install -y --no-install-recommends gettext ffmpeg
        working-directory: .
      - run: python manage.py compilemessages -v0
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DJANGO_SECRET_KEY: ${{ github.sha }}${{ github.sha }}${{ github.sha }}
          DJANGO_ALLOWED_HOSTS: example.com
      # El linter registra en la base de datos, así que necesita el esquema aplicado.
      # The linter logs to the database, so it needs the schema applied.
      - run: python manage.py migrate -v0
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      # Las migraciones iniciales crean tablas vacías; las de terceros no son nuestras.
      # Initial migrations create empty tables; third-party ones are not ours.
      - run: >-
          python manage.py lintmigrations --ignore-initial-migrations
          --exclude-apps axes django_db_logger simple_history
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --cov-report=xml
      - name: Cobertura del código nuevo / Coverage of new code
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # El esquema y los tipos del frontend se versionan; si no coinciden con el código, falla.
  # The schema and frontend types are committed; fail if they drift from the code.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Los ajustes de test cargan paquetes de desarrollo. / Test settings load dev packages.
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make api
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: El esquema y los tipos están al día / Schema and types are up to date
        run: git diff --exit-code -- backend/openapi.yaml frontend/src/api/schema.d.ts

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs-material mkdocs-static-i18n
      - run: mkdocs build --strict
