name: Mutation

# Nocturna y bajo demanda: es lenta y no debe bloquear los PRs.
# Nightly and on demand: it is slow and must not block PRs.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: sqlite:///db.sqlite3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get install -y --no-install-recommends gettext ffmpeg
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - run: python manage.py compilemessages -v0
      # mutmut guarda el resultado de cada mutante en mutants/ y solo repite los que cambian.
      # mutmut keeps each mutant's result in mutants/ and only reruns the ones that changed.
      - uses: actions/cache@v4
        with:
          path: backend/mutants
          key: mutmut-${{ github.run_id }}
          restore-keys: mutmut-
      - run: mutmut run
      - name: Resumen / Summary
        if: always()
        run: |
          {
            echo "## mutmut"
            echo '```'
            mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Stryker en modo incremental reutiliza el resultado de los mutantes que no cambian.
      # Incremental Stryker reuses the result of mutants that did not change.
      - uses: actions/cache@v4
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-${{ github.run_id }}
          restore-keys: stryker-
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation
